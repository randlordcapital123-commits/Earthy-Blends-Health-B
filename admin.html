<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <!-- Password Login Screen -->
  <div id="login-overlay" class="login-modal">
    <div class="login-box">
      <h2>Admin Login</h2>
      <form id="login-form">
        <input type="password" id="admin-password" placeholder="Enter Admin Password" required>
        <button type="submit">Unlock Panel</button>
      </form>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <!-- Protected Admin Content -->
  <div id="admin-dashboard" class="admin-dashboard hidden">
    <header class="admin-header">
      <h1>Admin Dashboard</h1>
      <button id="logout-btn" class="logout-btn">Log Out</button>
    </header>

    <main class="admin-content">
      <h2>Image Management</h2>
      <p>All images below display in full resolution without cropping (`object-fit: contain`).</p>
      
      <div class="image-grid">
        <!-- Sample Admin Image Cards -->
        <div class="image-card">
          <div class="image-wrapper">
            <img src="product1.jpg" alt="Product Image 1">
          </div>
          <p class="image-title">Product Image 1 (Full Frame)</p>
        </div>

        <div class="image-card">
          <div class="image-wrapper">
            <img src="product2.jpg" alt="Product Image 2">
          </div>
          <p class="image-title">Product Image 2 (Full Frame)</p>
        </div>
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
