<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Hero Section</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section with Background Image -->
  <header class="hero">
    <img src="hero-bg.jpg" alt="Hero Background" class="hero-bg">
    <div class="hero-overlay"></div>
    
    <div class="hero-content">
      <h1 class="hero-title">Welcome to Our Platform</h1>
      <p class="hero-subtitle">Discover amazing products and services crafted for you.</p>
      <a href="#explore" class="hero-btn">Explore Now</a>
    </div>
  </header>

</body>
</html>
